[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/platform",
    "crates/ui",
    "crates/services",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
windows = "0.62"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
raw-window-handle = "0.6"

orbit-core = { path = "crates/core" }
orbit-platform = { path = "crates/platform" }
orbit-ui = { path = "crates/ui" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
